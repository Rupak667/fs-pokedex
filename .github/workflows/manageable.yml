name: Manageable CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building project..."
          echo "Build complete"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..."
          echo "Tests passed"

  notify_success:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: success()
    steps:
      - name: Discord success notification
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"✅ Build + Tests Successful: ${{ github.repository }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}

  tag_release:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: success()
    steps:
      - name: Create tag
        run: |
          echo "Tagging release..."
          git tag v1.0.${{ github.run_number }}
          echo "Tag created"