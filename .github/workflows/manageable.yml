name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  # 1. Build job
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node (example)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build


  # 2. Unit tests
  unit_tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run test:unit


  # 3. End-to-end tests (can be parallelized later if split)
  e2e_tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run test:e2e


  # 4. Tag release (runs AFTER tests succeed, but independently of notifications)
  tag_release:
    runs-on: ubuntu-latest
    needs: [unit_tests, e2e_tests]

    steps:
      - uses: actions/checkout@v4

      - name: Create Git tag
        run: |
          git tag v1.0.${{ github.run_number }}
          git push origin v1.0.${{ github.run_number }}


  # 5. Notify success (runs in parallel with tagging conceptually after tests)
  notify_success:
    runs-on: ubuntu-latest
    needs: [unit_tests, e2e_tests]

    steps:
      - name: Send success message
        run: echo "✅ Pipeline succeeded! Build is green."