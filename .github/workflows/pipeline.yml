name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build step
        run: |
          echo "Building project..."
          echo "Build successful"

      - name: Discord notification (success)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"✅ Deployment Successful: ${{ github.repository }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord notification (failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"❌ Build Failed\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}